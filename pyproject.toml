[project]
name = "classifier-comparison"
version = "0.1.0"
description = "Session 8 assignment: KNN, SVM and MLP classifiers on Digits, with an MNIST and CNN extension"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

# PyTorch with CUDA 13.0 on Windows/Linux (NVIDIA GPU); the notebook falls back to CPU when CUDA is unavailable
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
